services:
  mysql:
    image: mysql:8.0
    container_name: bop-mysql
    restart: unless-stopped
    mem_limit: 1024m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - bop_mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bop-net

  redis:
    image: redis:7-alpine
    container_name: bop-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bop-net

  activemq:
    image: apache/activemq-classic:5.18.6
    container_name: bop-activemq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ACTIVEMQ_OPENWIRE_PORT:-61616}:61616"
      - "${ACTIVEMQ_CONSOLE_PORT:-8161}:8161"
    volumes:
      # 覆盖默认配置以显式开启 schedulerSupport 延迟投递
      - ./conf/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro
      - bop_activemq_data:/opt/apache-activemq/data
    networks:
      - bop-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: bop-nacos
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - bop_nacos_data:/home/nacos/data
    networks:
      - bop-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: bop-xxl-job
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx256m -Duser.timezone=Asia/Shanghai"
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}
    ports:
      - "${XXL_JOB_PORT:-18088}:8080"
    networks:
      - bop-net

networks:
  bop-net:
    driver: bridge

volumes:
  bop_mysql_data:
  bop_redis_data:
  bop_activemq_data:
  bop_nacos_data:
